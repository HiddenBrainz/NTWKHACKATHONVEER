<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIVE BREACH — autonomous red/blue agent simulation</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
  <link rel="stylesheet" href="styles-enhanced.css">
  <link rel="stylesheet" href="boot.css">
</head>
<body>
  <!-- ── Boot / loading screen (self-contained: boot.css + boot.js) ── -->
  <div id="bootScreen">
    <div class="boot-grid"></div>
    <div class="boot-sweep"></div>
    <div class="boot-scan"></div>
    <div class="boot-core">
      <div class="boot-logo">
        <span class="ring r1"></span>
        <span class="ring r2"></span>
        <span class="ring r3"></span>
        <span class="core-dot"></span>
      </div>
      <h1 class="boot-title" data-text="LIVE BREACH">LIVE BREACH</h1>
      <div class="boot-tag">autonomous red <span class="sep">/</span> blue adversarial simulation</div>
      <div class="boot-log" id="bootLog"></div>
      <div class="boot-progress">
        <div class="boot-bar"><div class="boot-bar-fill" id="bootBarFill"></div></div>
        <div class="boot-pct" id="bootPct">0%</div>
      </div>
      <div class="boot-hint">click anywhere to skip <span class="blink">_</span></div>
    </div>
  </div>
  <script src="boot.js"></script>

  <div class="breach-alert" id="breachAlert"></div>

  <div class="app" id="app">

    <!-- ── Topbar ── -->
    <header class="topbar">
      <div class="brand">LIVE<b>_</b>BREACH<span class="cursor">█</span></div>
      <div class="teams">
        <span class="tag red">red ×<span id="redCount">3</span></span>
        <span class="tag blu">blue ×<span id="blueCount">3</span></span>
      </div>
      <div class="metrics">
        <div class="metric"><span class="k">vuln</span><span class="v red" id="statVulns">0</span></div>
        <div class="metric"><span class="k">def</span><span class="v blu" id="statDefenses">0</span></div>
        <div class="metric"><span class="k">exfil</span><span class="v amb" id="statExfil">0 B</span></div>
      </div>
      <div class="actions">
        <button class="ghost danger" id="triggerBtn">▶ breach</button>
        <button class="ghost warn" id="stopBtn" disabled>■ stop</button>
        <button class="ghost" id="resetBtn">↺ reset</button>
      </div>
      <div class="status" id="statusPill">
        <span class="dot"></span><span class="txt">secure</span>
      </div>
    </header>

    <!-- ── Body grid ── -->
    <div class="grid">

      <!-- Left rail -->
      <aside class="rail">
        <section class="card" style="flex:1 1 auto;">
          <div class="card-h"><span class="card-t">agents</span><span class="card-m" id="agentCount">0 active</span></div>
          <div class="agents" id="agentsGrid"><div class="empty">awaiting deployment</div></div>
        </section>

        <section class="card map-card">
          <div class="card-h"><span class="card-t">network</span><span class="card-m" id="netMeta">5 nodes · idle</span></div>
          <svg id="attackMap" viewBox="0 0 600 420" xmlns="http://www.w3.org/2000/svg">
            <g id="edges"></g><g id="traffic"></g><g id="nodes"></g>
          </svg>
        </section>

        <section class="card meter-card">
          <div class="card-h"><span class="card-t">threat level</span><span class="card-m" id="meterValue">18%</span></div>
          <div class="meter"><div class="meter-fill" id="meterFill"></div></div>
        </section>
      </aside>

      <!-- Terminal hero -->
      <main class="term-wrap">
        <div class="term-bar">
          <div class="dots"><i class="r"></i><i class="y"></i><i class="g"></i></div>
          <span class="term-title" id="termTitle">root@acme-target — 10.0.0.15:3000</span>
          <div class="tabs">
            <span class="tab active" data-tab="console">console</span>
            <span class="tab" data-tab="exfil">exfil<span class="tab-badge" id="exfilBadge"></span></span>
          </div>
        </div>
        <div class="tab-pane active" id="tab-console"><div id="terminal"></div></div>
        <div class="tab-pane" id="tab-exfil">
          <div class="exfil" id="exfilContainer"><div class="empty">no data exfiltrated</div></div>
        </div>
      </main>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
  <script src="app.js"></script>
</body>
</html>
