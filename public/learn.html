<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Live Breach — Learn Mode</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="doc.css" />
<style>
  .learn { display: grid; grid-template-columns: 230px 1fr 320px; gap: 16px; height: calc(100vh - 70px); padding: 0 16px 16px; }
  @media (max-width: 1100px) { .learn { grid-template-columns: 1fr; height: auto; overflow: auto; } }

  /* lesson list */
  .lessons { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
  .lesson-item { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--line); border-radius: 8px; padding: 12px 14px; cursor: pointer; transition: all .15s; }
  .lesson-item:hover { border-color: rgba(37,255,154,0.35); }
  .lesson-item.active { border-left-color: var(--grn); background: rgba(37,255,154,0.04); }
  .lesson-item.done { border-left-color: var(--blu); }
  .lesson-item .ln { font-size: 10px; color: var(--dim); letter-spacing: 1px; }
  .lesson-item .lt { font-size: 13px; color: #fff; font-weight: 700; margin-top: 3px; }
  .lesson-item .lc { font-size: 10px; color: var(--dim); margin-top: 3px; }
  .lesson-item.done .lc::after { content: ' ✓'; color: var(--blu); }

  /* center stage */
  .stage { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .stage-head { padding: 16px 20px; border-bottom: 1px solid var(--line); }
  .stage-head .goal { color: var(--grn); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; font-weight: 800; }
  .stage-head h2 { margin: 6px 0 0; font-size: 22px; }
  .stage-body { padding: 18px 20px; overflow-y: auto; flex: 1; }
  .stage-body p { margin: 10px 0; }
  .task { background: var(--term); border: 1px solid var(--line); border-left: 3px solid var(--amb); border-radius: 8px; padding: 14px 16px; margin: 14px 0; }
  .task .tl { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--amb); font-weight: 800; }

  .try { display: flex; gap: 8px; margin: 14px 0; }
  .try input { flex: 1; font-family: inherit; background: var(--term); color: var(--txt); border: 1px solid var(--line-2); border-radius: 6px; padding: 10px 12px; font-size: 13px; }
  .try button { font-family: inherit; font-weight: 800; font-size: 12px; background: transparent; color: var(--red); border: 1px solid rgba(255,77,94,0.4); border-radius: 6px; padding: 0 16px; cursor: pointer; }
  .try button:hover { background: rgba(255,77,94,0.08); }
  .hints { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .hint-chip { font-size: 11px; color: var(--amb); background: var(--term); border: 1px dashed rgba(255,194,75,0.4); border-radius: 6px; padding: 4px 9px; cursor: pointer; }
  .hint-chip:hover { background: rgba(255,194,75,0.08); }

  .result { font-size: 13px; border-radius: 8px; padding: 12px 14px; margin: 12px 0; border: 1px solid var(--line); display: none; }
  .result.show { display: block; }
  .result.win { border-left: 3px solid var(--grn); background: rgba(37,255,154,0.05); }
  .result.fail { border-left: 3px solid var(--amb); background: rgba(255,194,75,0.04); }
  .result.block { border-left: 3px solid var(--blu); background: rgba(74,166,255,0.05); }
  .result pre { margin: 8px 0 0; font-size: 12px; }
  .why { margin-top: 10px; color: var(--dim); font-size: 12.5px; }
  .why b { color: #fff; }
  .ai-think { margin-top: 10px; font-size: 12px; }
  .ai-reason { margin: 8px 0; padding: 8px 12px; border-left: 2px solid var(--blu); background: rgba(74,166,255,0.06); color: #bcdcff; font-size: 12.5px; font-style: italic; border-radius: 0 6px 6px 0; }
  .summon { margin: 8px 0; }
  .summon-btn { font-family: inherit; font-size: 11px; color: var(--blu); background: transparent; border: 1px dashed rgba(74,166,255,0.4); border-radius: 6px; padding: 7px 12px; cursor: pointer; width: 100%; transition: all .12s; }
  .summon-btn:hover { background: rgba(74,166,255,0.06); border-color: rgba(74,166,255,0.7); }
  .summon-payload { margin: 8px 0; font-size: 12px; color: var(--dim); }
  .summon-payload code { color: var(--amb); background: var(--term); padding: 2px 6px; border-radius: 4px; }
  /* defense challenge */
  .def-node { background: var(--term); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin: 12px 0; font-size: 13px; }
  .def-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin: 12px 0; }
  @media (max-width: 720px) { .def-grid { grid-template-columns: 1fr; } }
  .def-toggle { font-family: inherit; text-align: left; background: var(--term); border: 1px solid var(--line-2); border-radius: 8px; padding: 11px 12px; cursor: pointer; transition: all .12s; display: flex; flex-direction: column; gap: 3px; }
  .def-toggle:hover { border-color: rgba(74,166,255,0.4); }
  .def-toggle.on { border-color: var(--blu); background: rgba(74,166,255,0.08); box-shadow: 0 0 10px rgba(74,166,255,0.15); }
  .def-toggle.on::before { content: '✓ '; color: var(--blu); }
  .def-name { font-size: 12px; font-weight: 800; color: #fff; }
  .def-desc { font-size: 10px; color: var(--dim); }
  .deploy-btn { font-family: inherit; font-weight: 800; font-size: 13px; background: transparent; color: var(--blu); border: 1px solid rgba(74,166,255,0.45); border-radius: 8px; padding: 11px 18px; cursor: pointer; width: 100%; margin-top: 6px; transition: all .12s; }
  .deploy-btn:hover { background: rgba(74,166,255,0.08); }

  .nextbtn { margin-top: 16px; font-family: inherit; font-weight: 800; font-size: 13px; background: transparent; color: var(--grn); border: 1px solid rgba(37,255,154,0.4); border-radius: 8px; padding: 10px 18px; cursor: pointer; display: none; }
  .nextbtn.show { display: inline-block; }
  .nextbtn:hover { background: rgba(37,255,154,0.07); }

  /* tutor */
  .tutor { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .tutor-head { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
  .tutor-head .av { width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #5cffb4, #25ff9a); display: flex; align-items: center; justify-content: center; font-size: 13px; }
  .tutor-head .tt { font-weight: 800; color: #fff; font-size: 13px; }
  .tutor-head .ts { font-size: 10px; color: var(--dim); }
  .tutor-log { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { font-size: 12.5px; line-height: 1.5; }
  .msg.bot { color: var(--txt); }
  .msg.bot::before { content: '🦉 '; }
  .msg.user { color: var(--blu); text-align: right; }
  .msg.user::after { content: ' 🧑'; }
  .msg.thinking { color: var(--dim); font-style: italic; }
  .tutor-ask { display: flex; gap: 6px; padding: 12px; border-top: 1px solid var(--line); }
  .tutor-ask input { flex: 1; font-family: inherit; background: var(--term); color: var(--txt); border: 1px solid var(--line-2); border-radius: 6px; padding: 8px 10px; font-size: 12px; }
  .tutor-ask button { font-family: inherit; font-weight: 800; font-size: 12px; background: transparent; color: var(--grn); border: 1px solid rgba(37,255,154,0.4); border-radius: 6px; padding: 0 12px; cursor: pointer; }
  .progress-pill { font-size: 11px; color: var(--dim); }

  /* gamified HUD */
  .hud { display: flex; align-items: center; gap: 12px; margin-left: 8px; }
  .hud-level { display: flex; flex-direction: column; line-height: 1.1; }
  .hud-lvl-num { font-size: 9px; color: var(--grn); font-weight: 800; letter-spacing: 1px; }
  .hud-lvl-name { font-size: 11px; color: #fff; font-weight: 700; }
  .hud-xpbar { width: 120px; height: 7px; background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden; }
  .hud-xpfill { height: 100%; background: linear-gradient(90deg, #25ff9a, #5cffb4); border-radius: 4px; transition: width .5s ease; box-shadow: 0 0 8px rgba(37,255,154,.5); }
  .hud-xp { font-size: 10px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .hud-score { font-size: 13px; color: var(--amb); font-weight: 800; font-variant-numeric: tabular-nums; }
  @media (max-width: 760px) { .hud-xpbar, .hud-xp { display: none; } }

  /* XP floating popup */
  .xp-popup {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -40%) scale(.8);
    z-index: 200; text-align: center; pointer-events: none; opacity: 0;
    transition: all .4s cubic-bezier(.2,1.4,.4,1);
    background: rgba(7,9,12,0.9); border: 1px solid rgba(37,255,154,.4);
    border-radius: 14px; padding: 18px 32px; box-shadow: 0 12px 50px rgba(37,255,154,.2);
  }
  .xp-popup.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .xp-popup.levelup { border-color: var(--amb); box-shadow: 0 12px 50px rgba(255,194,75,.35); }
  .xp-popup .xp-big { font-size: 34px; font-weight: 800; color: var(--grn); }
  .xp-popup.levelup .xp-big { color: var(--amb); }
  .xp-popup .xp-small { font-size: 12px; color: var(--dim); margin-top: 4px; }
</style>
</head>
<body>
  <nav class="topnav">
    <span class="brand">LIVE&nbsp;BREACH<span class="dot">.</span></span>
    <span style="color:var(--grn);font-size:11px;letter-spacing:2px;">LEARN</span>
    <div class="hud" id="hud"></div>
    <span class="spacer"></span>
    <span class="progress-pill" id="progressPill">0 / 5 complete</span>
    <a href="start.html">hub</a>
    <a href="/warroom.html">war room →</a>
  </nav>

  <div class="learn">
    <!-- lesson list -->
    <aside class="lessons" id="lessonList"></aside>

    <!-- center stage -->
    <section class="stage">
      <div class="stage-head">
        <div class="goal" id="stageGoal">Goal</div>
        <h2 id="stageTitle">Welcome</h2>
      </div>
      <div class="stage-body" id="stageBody"></div>
    </section>

    <!-- AI tutor -->
    <aside class="tutor">
      <div class="tutor-head">
        <div class="av">🦉</div>
        <div><div class="tt">AI Tutor</div><div class="ts">ask anything about what you're seeing</div></div>
      </div>
      <div class="tutor-log" id="tutorLog"></div>
      <div class="tutor-ask">
        <input id="tutorInput" placeholder="e.g. why did that work?" />
        <button id="tutorSend">ask</button>
      </div>
    </aside>
  </div>

  <script src="learn.js"></script>
</body>
</html>
